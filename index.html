<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Modern</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <h1>Snake</h1>

        <section class="info">
            <span>Puntos: <strong id="score">0</strong></span>
            <span>Récord: <strong id="highScore">0</strong></span>
        </section>

        <canvas id="gameCanvas" width="700" height="400"></canvas>

        <p id="message">Pulsa "Iniciar" para jugar</p>

        <div class="controls">
            <button id="startBtn">Iniciar</button>
        </div>

        <div class="mobile-controls" aria-label="Controles">
            <button data-direction="up">▲</button>
            <div>
                <button data-direction="left">◀</button>
                <button data-direction="down">▼</button>
                <button data-direction="right">▶</button>
            </div>
        </div>

        <p class="hint">También puedes usar las flechas del teclado.</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
